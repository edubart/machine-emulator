[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
auto_detect_remappings = false
via_ir = true
optimizer = true
optimizer_runs = 200
allow_paths = ['../step/']
remappings = [
    "@openzeppelin-contracts-5.5.0/=dependencies/@openzeppelin-contracts-5.5.0/",
    "prt-contracts/=./src",
    "step/=../step/",
]
solc_version = "0.8.30"
evm_version = "prague"
offline = true
